<!DOCTYPE html>
<html>
<head>
  <title>JARVIS — Spotify Auth</title>
  <style>
    body { background: #0a0a0f; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
    p { color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <p>Connecting Spotify...</p>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code  = params.get('code');
    var error = params.get('error');

    if (window.opener && window.opener.origin === window.location.origin) {
      // Opened as popup — send code back and close
      window.opener.postMessage({ type: 'spotify_callback', code: code, error: error }, window.location.origin);
      setTimeout(function(){ window.close(); }, 300);
    } else {
      // Opened as new tab — stash code and go back to JARVIS
      if (code) localStorage.setItem('sp_auth_code', code);
      window.location.href = '/';
    }
  </script>
</body>
</html>
